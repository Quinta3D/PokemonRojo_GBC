<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Pokemon Rojo</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#game-container {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
}

canvas {
    image-rendering: pixelated !important;
    image-rendering: crisp-edges !important;
    max-width: 100%;
    max-height: 100%;
}
</style>

</head>

<body>

<div id="game-container"></div>

<script>

/* ===== CAMBIAR JUEGO AQUÍ ===== */

var EJS_gameUrl = "./PokemonRed.gb";
var EJS_gameName = "Pokemon Rojo";

/* =============================== */

var EJS_core = "gambatte";

var EJS_pathtodata =
    "https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@main/data/";

var EJS_startOnLoaded = true;

var EJS_fullscreenOnLoaded = true;

var EJS_menuEnabled = true;

var EJS_controlScheme = "gb";

var EJS_defaultOptions = {
    "gambatte_gb_hwmode": "Auto",
    "gambatte_gb_colorization": "auto",
    "gambatte_gbc_color_correction": "GBC only",
    "gambatte_gbc_color_correction_mode": "accurate",
    "gambatte_gbc_frontlight_position": "central",
    "gambatte_mix_frames": "disabled"
};

function fullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function(){});
    }
}

window.addEventListener("load", function() {
    setTimeout(fullscreen, 1500);
});

document.addEventListener("click", fullscreen, { once: true });
document.addEventListener("touchstart", fullscreen, { once: true });

</script>

<script src="https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@main/data/loader.js"></script>

</body>
</html>
