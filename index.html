<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Pokemon Edición Rojo</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#game-container{
    width:100%;
    height:100%;
}

#fullscreen{
    position:fixed;
    top:15px;
    right:15px;
    z-index:99999;
    padding:12px 18px;
    background:#222;
    color:#fff;
    border:2px solid #fff;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

#fullscreen:active{
    transform:scale(.95);
}
</style>
</head>

<body>

<div id="game-container"></div>

<button id="fullscreen">PANTALLA COMPLETA</button>

<script>

EJS_player = '#game-container';

EJS_core = 'gb';

EJS_gameUrl = 'Pokemonrojo.gb';

EJS_startOnLoaded = true;

EJS_pathtodata =
'https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@main/data/';


// PANTALLA COMPLETA
function pantallaCompleta(){

    let elemento = document.documentElement;

    if(elemento.requestFullscreen){
        elemento.requestFullscreen();
    }
    else if(elemento.webkitRequestFullscreen){
        elemento.webkitRequestFullscreen();
    }
    else if(elemento.msRequestFullscreen){
        elemento.msRequestFullscreen();
    }

    document.getElementById('fullscreen').style.display='none';
}


// Intentar automáticamente
window.addEventListener('load',function(){

    setTimeout(function(){

        try{
            pantallaCompleta();
        }catch(e){}

    },1000);

});


// Botón
document.getElementById('fullscreen').onclick=function(){
    pantallaCompleta();
};

</script>

<script src="https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@main/data/loader.js"></script>

</body>
</html>
