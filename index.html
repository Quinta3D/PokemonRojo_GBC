<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>Game Boy / Game Boy Color</title>

<style>

/* =====================================================
   PANTALLA PRINCIPAL
   ===================================================== */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

    touch-action: none;

    -webkit-user-select: none;
    user-select: none;

}

#game-container {

    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    background: #000;

    overflow: hidden;

}


/* =====================================================
   CONTROLES TÁCTILES
   ===================================================== */

#touch-controls {

    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;

    height: 31vh;

    z-index: 99999;

    pointer-events: none;

}


/* =====================================================
   CRUCETA
   ===================================================== */

.dpad {

    position: absolute;

    left: 5vw;
    bottom: 5vh;

    width: 145px;
    height: 145px;

    pointer-events: auto;

}


/* Botones D-PAD */

.dpad button {

    position: absolute;

    width: 52px;
    height: 52px;

    border: 0;

    border-radius: 12px;

    background: #333;

    color: white;

    font-size: 26px;

    font-weight: bold;

    box-shadow:
        0 4px 0 #111,
        inset 0 2px 3px rgba(255,255,255,.15);

    touch-action: none;

    -webkit-tap-highlight-color: transparent;

}


/* Arriba */

#up {

    left: 46px;
    top: 0;

}


/* Abajo */

#down {

    left: 46px;
    bottom: 0;

}


/* Izquierda */

#left {

    left: 0;
    top: 46px;

}


/* Derecha */

#right {

    right: 0;
    top: 46px;

}


/* Centro */

#center {

    position: absolute;

    left: 46px;
    top: 46px;

    width: 52px;
    height: 52px;

    background: #222;

    border-radius: 8px;

}


/* =====================================================
   BOTONES A / B
   ===================================================== */

.action-buttons {

    position: absolute;

    right: 5vw;
    bottom: 7vh;

    display: flex;

    gap: 22px;

    pointer-events: auto;

}


.action {

    width: 70px;
    height: 70px;

    border-radius: 50%;

    border: 0;

    background: #333;

    color: white;

    font-size: 25px;

    font-weight: bold;

    box-shadow:
        0 5px 0 #111,
        inset 0 3px 4px rgba(255,255,255,.15);

    touch-action: none;

    -webkit-tap-highlight-color: transparent;

}


/* =====================================================
   SELECT / START
   ===================================================== */

.system-buttons {

    position: absolute;

    left: 50%;

    bottom: 2vh;

    transform: translateX(-50%);

    display: flex;

    gap: 18px;

    pointer-events: auto;

}


.system {

    width: 78px;
    height: 32px;

    border: 0;

    border-radius: 18px;

    background: #333;

    color: white;

    font-size: 12px;

    font-weight: bold;

    box-shadow: 0 3px 0 #111;

    touch-action: none;

}


/* =====================================================
   EFECTO AL PRESIONAR
   ===================================================== */

.touch-button:active {

    transform: translateY(3px);

    box-shadow:
        0 1px 0 #111,
        inset 0 2px 3px rgba(255,255,255,.15);

}


/* =====================================================
   CELULARES PEQUEÑOS
   ===================================================== */

@media (max-width: 500px) {

    .dpad {

        left: 3vw;
        bottom: 4vh;

        width: 135px;
        height: 135px;

    }

    .dpad button {

        width: 50px;
        height: 50px;

    }

    #up {
        left: 42px;
    }

    #down {
        left: 42px;
    }

    #left {
        top: 42px;
    }

    #right {
        top: 42px;
    }

    #center {

        left: 42px;
        top: 42px;

        width: 50px;

    }

    .action-buttons {

        right: 4vw;
        bottom: 6vh;

        gap: 14px;

    }

    .action {

        width: 65px;
        height: 65px;

    }

}


/* =====================================================
   PANTALLAS GRANDES
   ===================================================== */

@media (min-width: 800px) {

    .dpad {

        transform: scale(1.15);
        transform-origin: bottom left;

    }

    .action-buttons {

        transform: scale(1.15);
        transform-origin: bottom right;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     EMULADOR
     ===================================================== -->

<div id="game-container"></div>


<!-- =====================================================
     CONTROLES TÁCTILES
     ===================================================== -->

<div id="touch-controls">


    <!-- D-PAD -->

    <div class="dpad">

        <button
            id="up"
            class="touch-button"
            data-key="ArrowUp">
            ▲
        </button>

        <button
            id="down"
            class="touch-button"
            data-key="ArrowDown">
            ▼
        </button>

        <button
            id="left"
            class="touch-button"
            data-key="ArrowLeft">
            ◀
        </button>

        <button
            id="right"
            class="touch-button"
            data-key="ArrowRight">
            ▶
        </button>

        <div id="center"></div>

    </div>


    <!-- A / B -->

    <div class="action-buttons">

        <button
            class="action touch-button"
            data-key="x">
            A
        </button>

        <button
            class="action touch-button"
            data-key="z">
            B
        </button>

    </div>


    <!-- SELECT / START -->

    <div class="system-buttons">

        <button
            class="system touch-button"
            data-key="Shift">
            SELECT
        </button>

        <button
            class="system touch-button"
            data-key="Enter">
            START
        </button>

    </div>


</div>


<script>

/* =====================================================
   EMULATORJS
   ===================================================== */


/*
   IMPORTANTE:

   Se utilizamos "gb", EmulatorJS puede manejar
   ROMs Game Boy y Game Boy Color.

   NO forzamos "gbc".

   Esto permite mantener la compatibilidad con
   juegos .GB y .GBC.
*/

EJS_player = '#game-container';

EJS_core = 'gbc';


/*
   ROM

   Puedes cambiar este nombre por cualquier ROM
   compatible.
*/

EJS_gameUrl = 'pokemonrojo.gb';


/*
   Inicio automático
*/

EJS_startOnLoaded = true;


/*
   Datos del emulador
*/

EJS_pathtodata =
'https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@main/data/';


/* =====================================================
   PANTALLA COMPLETA
   ===================================================== */

function entrarFullscreen() {

    if (document.fullscreenElement)
        return;

    let elemento = document.documentElement;

    if (elemento.requestFullscreen) {

        elemento.requestFullscreen().catch(() => {});

    }

    else if (elemento.webkitRequestFullscreen) {

        elemento.webkitRequestFullscreen();

    }

}


/*
   Intentar fullscreen al cargar
*/

window.addEventListener('load', function() {

    setTimeout(function() {

        entrarFullscreen();

    }, 1200);

});


/*
   Activar fullscreen al primer toque
*/

document.addEventListener(
    'touchstart',
    entrarFullscreen,
    { once: true }
);

document.addEventListener(
    'click',
    entrarFullscreen,
    { once: true }
);


/* =====================================================
   CONTROLES TÁCTILES
   ===================================================== */


/*
   Enviar teclas al navegador.

   Usamos keydown al tocar y keyup al soltar.

   Esto permite mantener presionado un botón.
*/

function enviarTecla(tecla, tipo) {

    const evento = new KeyboardEvent(tipo, {

        key: tecla,

        code: tecla,

        keyCode:
            tecla === 'ArrowUp' ? 38 :
            tecla === 'ArrowDown' ? 40 :
            tecla === 'ArrowLeft' ? 37 :
            tecla === 'ArrowRight' ? 39 :
            tecla === 'Enter' ? 13 :
            tecla === 'Shift' ? 16 :
            tecla.toLowerCase() === 'x' ? 88 :
            tecla.toLowerCase() === 'z' ? 90 :
            0,

        which:
            tecla === 'ArrowUp' ? 38 :
            tecla === 'ArrowDown' ? 40 :
            tecla === 'ArrowLeft' ? 37 :
            tecla === 'ArrowRight' ? 39 :
            tecla === 'Enter' ? 13 :
            tecla === 'Shift' ? 16 :
            tecla.toLowerCase() === 'x' ? 88 :
            tecla.toLowerCase() === 'z' ? 90 :
            0,

        bubbles: true,

        cancelable: true

    });

    document.dispatchEvent(evento);

}


/* =====================================================
   PRESIONAR BOTÓN
   ===================================================== */

function presionarBoton(elemento) {

    const tecla = elemento.dataset.key;

    if (!tecla)
        return;

    elemento.dataset.pressed = 'true';

    enviarTecla(tecla, 'keydown');

}


/* =====================================================
   SOLTAR BOTÓN
   ===================================================== */

function soltarBoton(elemento) {

    const tecla = elemento.dataset.key;

    if (!tecla)
        return;

    if (elemento.dataset.pressed !== 'true')
        return;

    elemento.dataset.pressed = 'false';

    enviarTecla(tecla, 'keyup');

}


/* =====================================================
   SOPORTE TOUCH
   ===================================================== */

document.querySelectorAll('.touch-button')
.forEach(function(elemento) {


    elemento.addEventListener(
        'touchstart',
        function(evento) {

            evento.preventDefault();

            presionarBoton(elemento);

        },
        {
            passive: false
        }
    );


    elemento.addEventListener(
        'touchend',
        function(evento) {

            evento.preventDefault();

            soltarBoton(elemento);

        },
        {
            passive: false
        }
    );


    elemento.addEventListener(
        'touchcancel',
        function(evento) {

            evento.preventDefault();

            soltarBoton(elemento);

        },
        {
            passive: false
        }
    );


    /*
       También permite jugar con mouse
    */

    elemento.addEventListener(
        'mousedown',
        function(evento) {

            evento.preventDefault();

            presionarBoton(elemento);

        }
    );


    elemento.addEventListener(
        'mouseup',
        function(evento) {

            evento.preventDefault();

            soltarBoton(elemento);

        }
    );


    elemento.addEventListener(
        'mouseleave',
        function() {

            soltarBoton(elemento);

        }
    );

});


/* =====================================================
   EVITAR ZOOM
   ===================================================== */

document.addEventListener(
    'gesturestart',
    function(evento) {

        evento.preventDefault();

    }
);


document.addEventListener(
    'dblclick',
    function(evento) {

        evento.preventDefault();

    },
    {
        passive: false
    }
);

</script>


<!-- =====================================================
     CARGAR EMULATORJS
     ===================================================== -->

<script src=
"https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@main/data/loader.js">
</script>


</body>

</html>
